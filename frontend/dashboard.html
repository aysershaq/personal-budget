<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Personal Budget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="dashboard-section">
        <header class="top-bar">
          <h1>Dashboard</h1>
          <button id="logout-button" class="secondary" type="button">Logout</button>
        </header>

        <section id="user-info" class="info-panel"></section>
        <section id="summary-info" class="info-panel"></section>

        <!-- Envelopes list (Edit/Delete buttons + inline edit forms will be injected here by dashboard.js) -->
        <section id="envelope-list" class="info-panel"></section>

        <!-- Transactions table (Delete buttons will be injected here by dashboard.js) -->
        <section id="transaction-list" class="info-panel"></section>

        <!-- Reports filter will be injected here (NEW container for stable placement) -->
        <section id="reports-filter-container" class="info-panel"></section>

        <!-- Reports tables will be rendered here -->
        <section id="reports-section" class="info-panel"></section>

        <section id="actions-section" class="actions">
          <form id="add-envelope-form" class="card" autocomplete="off">
            <h2>Add Envelope</h2>
            <label for="envelope-name">Envelope Name</label>
            <input
              type="text"
              id="envelope-name"
              required
              placeholder="Envelope Name"
            />

            <label for="envelope-budget">Budget Amount</label>
            <input
              type="number"
              id="envelope-budget"
              required
              min="0"
              step="0.01"
              placeholder="Budget Amount"
            />

            <button type="submit" class="primary">Add Envelope</button>
          </form>

          <form id="add-transaction-form" class="card" autocomplete="off">
            <h2>Add Transaction</h2>

            <label for="transaction-type">Type</label>
            <select id="transaction-type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
              <option value="transfer">Transfer</option>
            </select>

            <label for="transaction-amount">Amount</label>
            <input
              type="number"
              id="transaction-amount"
              required
              min="0"
              step="0.01"
              placeholder="Amount"
            />

            <label for="transaction-date">Date</label>
            <input type="date" id="transaction-date" required />

            <label for="transaction-envelope">Envelope</label>
            <select id="transaction-envelope" required></select>

            <label for="transaction-to-envelope" class="transfer-only hidden">Transfer To</label>
            <select id="transaction-to-envelope" class="transfer-only hidden"></select>

        

            <button type="submit" class="primary">Add Transaction</button>
          </form>
        </section>
      </section>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
