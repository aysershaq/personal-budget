<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register – Personal Budget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <section>
        <h1 class="app-title">Register</h1>
        <form id="register-form" class="card">
          <h2>Register</h2>
          <input type="text" id="register-name" required placeholder="Name" />
          <input type="email" id="register-email" required placeholder="Email" />
          <input type="password" id="register-password" required placeholder="Password" />
          <button type="submit" class="primary">Register</button>
          <p>Already have an account? <a href="login.html">Login here</a></p>
        </form>
      </section>
    </div>
    <script src="register.js"></script>
  </body>
</html>
